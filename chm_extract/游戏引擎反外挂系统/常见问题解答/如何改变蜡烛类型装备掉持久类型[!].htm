<title>如何改变蜡烛类型装备掉持久类型</title>
</HEAD>
<BODY>
<P><FONT size=2>功能：<BR>　　自定义蜡烛物品掉持久控制，支持按时间掉持久或与普通装备一样受攻击掉持久。</FONT></P>
<P><FONT size=2>用法：<BR>　　按时间掉持久：数品数据库中Source字段为：０<BR>　　受攻击掉持久：物品数据库中Source字段为：１</FONT></P>
<P>修改蜡烛、火把的Shape值为亮度，亮度为1-5最高亮度5。<BR><BR>当M2勾选随持久改变亮度的时候，亮度只受持久控制不受Shape，持久10000=1点亮度，最高亮度5<BR>超过50000持久亮度也是5。</P>
</BODY>
</HTML>
