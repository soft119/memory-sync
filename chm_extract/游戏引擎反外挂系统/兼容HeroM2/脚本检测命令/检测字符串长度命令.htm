<p><b><font color="#0000ff" size="2">功能：</font></b><font size="2"><br>
<br>
&nbsp;&nbsp; 检测字符串长度命令<br>
<br>
</font><b><font color="#0000ff" size="2">格式：</font></b><font size="2"><br>
<br>
&nbsp;&nbsp; CheckStringlength 字符串 操作符(&lt;,&gt;,=,?) 位数<br>
<br>
说明：一个汉字位数为2, "》"也为2个字符<br>
<br>
[@test]<br>
#IF<br>
CheckStringlength D3dm2 &gt; 3<br>
#SAY<br>
D3dm2大于3个字符<br>
#ELSESAY<br>
D3dm2小于3个字符<br>
<br>
　</font></p>
