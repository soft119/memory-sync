<BODY>
<P><FONT face=Fixedsys size=2>功能: 设置装备发光<BR>说明: 衣服,武器和头盔不支持次功能.<BR>适用: 
英雄M2<BR>格式: SetItemsLight 位置(0-12) 值(1=发光效果1 2=发光效果2&nbsp;0=不发光).<BR><FONT 
color=#ff00ff>其他</FONT>: 
选择效果点击&nbsp;M2\选项\功能设置\内挂控制<BR><BR>发光效果1:<BR>#IF<BR>#ACT<BR>SetItemsLight 3 
1<BR><BR></FONT></P>
<P><FONT face=Fixedsys size=2>发光效果2:<BR>#IF<BR>#ACT<BR>SetItemsLight 3 
2<BR><BR><BR>取消发光:<BR>#IF<BR>#ACT<BR>SetItemsLight 3 0</FONT></P></BODY>
</html>
