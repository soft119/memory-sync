<H3><FONT color=#0000ff>顶戴花翎扩展(宝宝)<BR><SPAN 
style="FONT-SIZE: 12pt; FONT-WEIGHT: bold"></SPAN></FONT></H3><SPAN 
style="FONT-SIZE: 12pt; FONT-WEIGHT: bold"><FONT face=宋体>
<P><SPAN style="FONT-SIZE: 12pt; FONT-WEIGHT: bold">SetIconEx </SPAN></P>
<P>参数1=宝宝名字 ALL=所有宝宝</P>
<P>参数2=位置(0-9)</P>
<P>参数3=WIL文件序号</P>
<P>参数4=图片序号(0-65535)</P>
<P>参数5=X 参数6=Y</P>
<P>参数7=播放张数</P>
<P>参数8=播放效果(0普通 1特效)</P>
<P>参数9=播放速度(毫秒)</P>
<P>参数10=是否只有自己看见(0=所有人都可以看见 1=仅仅自己可以看见)</P>
<P>例子：</P>
<P>&nbsp;</P>
<P>#IF<BR>#ACT<BR>SetIconEx&nbsp;强化神兽 0 0 11 1 -20 1 0 300 0<BR>SENDMSG 6 
你的宝宝强化神兽头顶加了一组花翎<BR>Break</P></FONT></SPAN></body>
