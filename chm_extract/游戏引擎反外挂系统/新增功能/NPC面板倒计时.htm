<body>
<P><FONT color=#0000ff face=宋体>NPC对话框内倒计时</FONT></P>
<P><BR><FONT face=宋体>说明：NPC对话框内倒计时显示</FONT></P>
<P><FONT face=宋体 color=#ff0000>格式：&lt;COUNTDOWN:倒计时时间(秒):次数(0无限次):颜色:X:Y/@触发&gt;</FONT></P>
<P><FONT face=宋体>示列：<BR>倒时计：&lt;COUNTDOWN:10:3:251:0:0/@倒计时结束&gt;\<BR><BR><BR><BR></FONT></P>
<P><FONT face=宋体><FONT color=#ff0000>格式：&lt;TIMETIPS:倒计时时间(秒):次数(0无限次):颜色:X:Y/@触发&gt;</FONT><BR>显示格式为:天数+小时+分钟+秒</FONT></P>
<P><FONT face=宋体>示列：<BR>倒时计：&lt;TIMETIPS:10:3:251:0:0/@倒计时结束&gt;\</FONT></P>
<P><FONT face=宋体>NPC文本触发<BR>[@触发]<BR>#IF<BR>#ACT<BR>SENDMSG 5 倒计时已结束</FONT></P>
<P><FONT face=宋体>[@倒计时结束]<BR>#IF<BR>#ACT<BR>SENDMSG 5 
天数倒计时已经结束<BR><BR><BR><BR><BR><BR><BR><BR><BR><BR><BR></FONT></P></body>
