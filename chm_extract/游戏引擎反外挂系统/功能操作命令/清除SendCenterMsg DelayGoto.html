<title>清除SendCenterMsg DelayGoto</title>
</head>

<body>
<p><FONT face=宋体><FONT color=#000000><FONT color=#0000ff>清除延迟跳转:</FONT><BR>CLEARDELAYGOTO <BR> 
<BR>参数1：空为清楚全部倒计时&nbsp; <BR> <BR>参数2：@清除指定跳转字段</FONT><BR><BR><BR>[@main]<br>
#act<br>
CLEARDELAYGOTO<br>
sendmsg 6 
DELAYGOTO延迟时清除</FONT>
  </p>
<p><FONT face=宋体>[@main]<br>
  #act<br>
  CLEARDELAYGOTO 1<br>
sendmsg 6 SendCenterMsg倒计时清除<BR><BR><BR>[@main]<br>
  #act<br>
  CLEARDELAYGOTO
  1 @新手赠送<br>
sendmsg 6 
清除字段为@新手赠送的倒计时&nbsp;</FONT>&nbsp;
  </p>
<p><FONT face=宋体></FONT>&nbsp;</p>
<p><FONT face=宋体></FONT>&nbsp;</p>
</body>
</html>
