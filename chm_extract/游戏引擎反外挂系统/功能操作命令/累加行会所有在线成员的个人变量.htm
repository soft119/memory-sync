<title>累加行会所有在线成员的个人变量</title>
</head>

<body>
<p><FONT face=宋体>累加行会所有在线成员的个人变量<br>
AddGuildHumVar 行会名称 需要累加的变量(N等等数字变量) 累加结果保存变量</FONT>
   </p>
<p><FONT face=宋体>;示例<br>
  ADDGuildHumVar 兄弟团 U20 N$统计总数<br>
  sendmsg 7 
兄弟团中的所有在线成员的U20变量累加合计为&lt;$STR(N$统计总数)&gt;</FONT>
    </p>
</body>
</html>
