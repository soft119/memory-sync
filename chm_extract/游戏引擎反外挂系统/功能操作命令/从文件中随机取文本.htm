<title>从文件中随机取文本</title>
</HEAD>
<BODY>
<P><FONT face=宋体><FONT size=2><FONT color=#0000ff><STRONG>功能：</STRONG></FONT><BR>
&nbsp;&nbsp;&nbsp;</FONT><font size="2" >从文件中随机取文本</font><FONT size=2>。</FONT></FONT></P>
<P><FONT face=宋体><FONT size=2><STRONG><FONT color=#0000ff>格式：</FONT><BR>
</STRONG>&nbsp;&nbsp;&nbsp; GETRANDOMLINETEXT 文件 字符串变量<BR>
  <BR>
  ;==========================================<BR>
  ;示例脚本<br>
  [@Main]<br>
  #If
  <br>
  #Act<br>
  GETRANDOMLINETEXT ..\QuestDiary\装备列表.txt S0<br>
  #Say<br> 
  取回的文本是：
&lt;$STR(S</FONT><FONT size=2>0)&gt;</FONT></FONT><font size="2"><BR><FONT face=宋体>
  ;==========================================<BR>
  <BR></FONT>
  </font><FONT size=3>注：GetCacheRandomLineText写法一样，区别只是从缓存检测，速度更快，但是只读取一次，修改文本也不会再更新<BR>
  </FONT></P>
</BODY>
</HTML>
