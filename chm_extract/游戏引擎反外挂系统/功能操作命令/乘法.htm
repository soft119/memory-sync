<p>乘法 格式: MUL N1 N2 N3即N1=N2*N3</p>
<p><FONT face=宋体>[@MAIN]<br>
  #IF<br>
  #ACT<br>
  Mov N2 10<br>
  Mov N3 10<br>
  MUL N1 &lt;$STR(N2)&gt; &lt;$STR(N3)&gt;<br>
SENDMSG 1 结果∶&lt;$STR(N1)&gt;</FONT></FONT>
  </p></FONT>
