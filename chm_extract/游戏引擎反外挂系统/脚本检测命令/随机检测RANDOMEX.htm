<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>随机检测RANDOMEX</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">

</head>

<BODY>
<p>RANDOMEX 随机数(子) 随机数(母)<br>
随机数(子)，数值越大几率越高，如果和随机数(母)数值一样大，就是百分百几率</p>
<p>[@main]<br>
  #IF<br>
  RANDOMEX 50 100<br>
  #ACT<br>
  SENDMSG 6 你触发了百分之五十的几率</p>
</BODY>
</html>
