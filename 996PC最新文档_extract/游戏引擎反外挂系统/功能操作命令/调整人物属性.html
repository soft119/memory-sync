<title>调整人物属性</title>

<body>

<p><FONT face=宋体><strong><font color="#0000ff" size="2">功</font></strong><font color="#0000ff" size="2"><strong>能：</strong></font> 
调整人物属性</FONT> </p>
<p><FONT face=宋体><span class="STYLE1">格式:</span> ChangeHumAbility 属性(1-20) 操作符(+ = -) 效果(1-21亿) 时间秒(为0时，不限制时间)<br>
  <span class="STYLE1">说明:</span> 属性1-12分别对应人物 防御下限 防御上限 魔御下限 魔御上限 攻击下限 攻击上限 魔法下限 魔法上限 道术下限 道术上限 MaxHP MaxMP HP恢复 MP恢复 毒恢复 毒躲避 魔法躲避 准确 敏捷 幸运<br>
  <span class="STYLE1">注意:</span> 
调整后的属性效果只在人物在线时有效.不带时间为在线一直有效</FONT> </p>
<p><br>
  <font color="#0000ff" size="2"><strong><br><FONT face=宋体>
例子：<br></FONT>
</strong></font><br><FONT face=宋体>[@Test]</FONT>
<font color="#0000ff" size="2"><strong><br>
</strong></font><FONT face=宋体>#IF<br>
#ACT<br>
ChangeHumAbility 2 + 10 60<br>
#SAY<br>
你的防御上限增加10点.60秒后恢复</FONT>
</p>
</body>

</html>
