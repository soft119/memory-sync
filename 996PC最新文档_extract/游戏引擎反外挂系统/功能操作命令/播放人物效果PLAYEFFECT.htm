<body>
<p><FONT face=宋体>格式: PLAYEFFECT WIL文件序号 开始图片数 播放图片张数 播放次数 
播放速度(毫秒) 绘制模式(0特效绘制，1普通绘制) X Y 播放顺序(0角色上面 1角色下面) </FONT>            </p>
<p class="style1"><FONT face=宋体>支持怪物</FONT></p>
<p><FONT face=宋体>WIL文件序号是在M2里编辑好的，详见M2-查看-列表信息二-WIL资源</FONT></p>
<p><FONT face=宋体>[@main]<br >
  #ACT<br >
  PLAYEFFECT 0 0 10 1 300 </FONT>
        </p>
<p><FONT face=宋体> </FONT>
        </p>
<P><FONT face=宋体>清空PLAYEFFECT播放的特效<FONT size=2 > 
</FONT></FONT></P>
<p><FONT face=宋体>[@测试]<br>#ACT<br><span class=style1>CLEARPLAYEFFECT</span></FONT></p>
