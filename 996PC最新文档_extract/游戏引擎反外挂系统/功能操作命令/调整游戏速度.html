<title>调整游戏速度</title>
</head>

<body>
<p><FONT face=宋体>格式: ChangeSpeed 速度类型 速度值 有效时间(秒，该参数为空时表示不限制时间)<br >
  速度类型 1为 移动速度 2为攻击速度 3为魔法速度<br >
速度值(-10和10之间 小于0为减速 等于0不变速)</FONT>
  </p>
<p><FONT face=宋体>[@main]<br >
  #ACT<br >
  CHANGESPEED 1 5<br >
  #SAY<br >
移动速度增加</FONT>
</p>
<p><FONT face=宋体></FONT>&nbsp;</p>
<p><FONT face=宋体></FONT>&nbsp;</p>
</body>
</html>
