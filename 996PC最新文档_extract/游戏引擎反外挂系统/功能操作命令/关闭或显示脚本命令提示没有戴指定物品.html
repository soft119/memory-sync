<title>关闭或显示脚本命令提示没有戴指定物品</title>
</HEAD>
<BODY>
<P><FONT face=宋体>SETSHOWITEMMSG (0关闭，1显示)</FONT> </P>
<P><FONT face=宋体>用来关闭或显示，有的脚本命令会提示“你身上没有戴指定物品！！！”</FONT></P>
<P><FONT color=#ff0000 face=宋体>(引擎不会提示这个错误，直接删掉这个命令就行)</FONT></P>
<P><FONT face=宋体></FONT>&nbsp;</P>
<P><FONT face=宋体><BR></FONT>
</P>
