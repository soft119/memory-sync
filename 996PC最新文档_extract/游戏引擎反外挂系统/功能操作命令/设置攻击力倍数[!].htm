<head>
<title>设置攻击力倍数[!]</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">

</head>

<BODY>
<P><FONT face=宋体><STRONG>功能：</STRONG><BR>
设置攻击力倍数</FONT>
</P>
<p><FONT face=宋体><STRONG>格式：<BR>
  </STRONG>POWERRATE 倍率 有效时间<BR>
倍率 为杀攻击力倍数，倍数除以100为真正的倍率(200为2倍攻击，150为1.5倍攻击)<STRONG>支持变量操作</STRONG><BR>
  <BR>
  ;==========================================<BR>
  [@POWERRATE]<BR>
  #IF<BR>
  #ACT<BR>
 POWERRATE 1000   600  <BR>
  #SAY<BR>
您当前攻击力倍数为 10倍，有效时间   600秒。  <BR>
  ;==========================================<BR></FONT>
</p>
</BODY>
</html>
