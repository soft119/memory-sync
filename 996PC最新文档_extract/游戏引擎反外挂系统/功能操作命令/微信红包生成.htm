<title>微信红包生成</title>

<body>
<p><FONT face=宋体>微信红包生成到文件<br>
RedEnvelopeSaveToList 导出文本路径 红包总金额 模式(0平均,1随机) 红包数量 
最小红包(随机模式有效) 最大红包(随机模式有效，必须大于平均值，设置为0时自动模式)</FONT>
      </p>
<P><FONT color=#ff0000 size=2 face=宋体>(暂不支持)</FONT></P>
<p><FONT face=宋体>;示例<br>
  [@生成红包到文件]<br>
  #ACT<br>
  RedEnvelopeSaveToList 
..\QuestDiary\红包.txt 1000 1 20 5 100</FONT>
        </p>
</body>
