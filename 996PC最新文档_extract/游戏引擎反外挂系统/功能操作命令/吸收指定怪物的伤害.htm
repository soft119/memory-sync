<HEAD>

<title>吸收指定怪物的伤害</title>
<style type="text/css">
<!--
.style1 {color: #0000FF;
	font-weight: bold;
}
-->
</style>
</head>

<body>
<p class="style1"><FONT face=宋体><FONT color=#0000ff>STRUCKDAMAGEABSORB 
怪物名称(*表示所有怪物) 吸收百分比(1~100) 有效时间（秒）</FONT> 
</FONT>   </p>
<p class="style1"><FONT face=宋体></FONT>&nbsp;</p>
<p class="style1"><FONT face=宋体><FONT color=#000000>[@吸收所有怪物的伤害]<br >
#act<br >
STRUCKDAMAGEABSORB * 80 360<br >
SENDMSG 6 所有怪物对你的攻击伤害被吸收80%，实际攻击只有原来的20% </FONT></FONT>
  </p>
<p class="style1"><FONT face=宋体><FONT color=#000000>[@吸收白野猪的伤害]<br ></FONT><FONT color=#000000>
  #act<br >
  STRUCKDAMAGEABSORB 白野猪 80 360<br >
  SENDMSG 
6 白野猪对你的攻击伤害被吸收80%，实际攻击只有原来的20%</FONT>
     </FONT>
    </p>
<p><FONT face=宋体></FONT>&nbsp;</p>
</body>
</html>
