<p><FONT face=宋体>打开自定义NPC对话框 </FONT> </p>
<p><FONT face=宋体>格式：OpenBigDialogBox WIL文件编号 
图片编号</FONT>   </p>
<p><FONT face=宋体>范例：</FONT></p>
<p><FONT face=宋体>[@main]<br >
  #ACT<br >
  OpenBigDialogBox 16 109<br >
  #SAY<br >&lt;Img:115:16:602:-15/@Label&gt;</FONT>
</p>
<p><FONT face=宋体>[@Label]<br >
  #IF<br >
  #ACT<br >
  CloseBigDialogBox<br >
  Close</FONT>
