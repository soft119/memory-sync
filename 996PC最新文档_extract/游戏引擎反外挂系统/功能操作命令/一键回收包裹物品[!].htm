<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML><HEAD><title>一键回收包裹物品[!]</title>
<META content="text/html; charset=gb2312" http-equiv=Content-Type>
<META name=GENERATOR content="MSHTML 11.00.10570.1001"></HEAD>
<BODY>
<p><FONT face=宋体>一键回收包裹物品的脚本命令<br >
  格式：<br >
TakeBagItem 物品名称(支持多个物品) 收取数量 
每个物品增加元宝值 每个物品增加金币值 每个物品增加泡点值 每个物品增加泡点经验值 变量(保存实际回收的物品数量) 聚灵珠经验(为空或0时不增加聚灵珠经验 
1时同时聚灵珠经验)</FONT> 是否回收极品(0或空全部回收,1不回收极品,2只回收极品)
          </p>
<p><FONT face=宋体>[@main]<br >
  #ACT<br >
  TakeBagItem 木剑|布衣(男)|布衣(女) 46 0 0 0 10000 N1 0 <br >
  SENDMSG 6 
成功回收&lt;$STR(N1)&gt;个木剑，布衣(男)，布衣(女)，价格为10000经验</FONT>
    </p></BODY></HTML>
