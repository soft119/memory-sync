<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0//EN">
<HTML>
<HEAD>
<meta http-equiv="Content-Language" content="zh-cn">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">
<title>Take命令扩展</title>
</head>

<body>
<p> Take物品名称数量是否部分匹配(0或空=名称必须完全一样,1= 
    名称部分一样)是否检测改名名称(0=或空不检测1= 检测) </p>
<p><FONT face=宋体>[@main]<br>
  #if<br>
  #act<br>
  Take 木剑 1<br>
SENDMSG 6 收回木剑</FONT></FONT>
  </p>
<p><FONT face=宋体>[@main]<br>
  #if<br>
  #act<br>
  Take 改名木剑 1 0 1<br>
  SENDMSG 6 收回改名木剑</FONT>
    </p>
<p><FONT face=宋体>[@main]<br>
  #if<br>
  #act<br>
  Take 剑 1 1 0<br>
  SENDMSG 6 收回名称有“剑”的物品</FONT>
    </p>
<p><FONT face=宋体>[@main]<br>
  #if<br>
  #act<br>
  Take 剑 1 1 1<br>
  SENDMSG 6 收回改名名称有“剑”的物品</FONT>
    </p></FONT>
</body>
</html>
