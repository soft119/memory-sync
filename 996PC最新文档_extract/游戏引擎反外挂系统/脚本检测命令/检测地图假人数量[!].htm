<BODY>
<P><FONT face=Fixedsys size=2>CHECKMAPDUMMYCOUNT,检测地图假人数量<br>
格式:检测地图假人数量 地图 （&lt; &gt; =）<BR><FONT color=#ff0000>(暂不支持)</FONT><BR>例子:</FONT></P>
<P>[@main]<br>
  #IF<br>
  CHECKMAPDUMMYCOUNT 3 &gt; 10<br>
  #SAY<br>
地图3假人数量大于10个</P>
