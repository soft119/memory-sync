<body>

<p><font color="#0000ff" size="2"><strong>功能:<br>
&nbsp; </strong></font><font size="2">检测当前人物是否佩带指定物品 </font><br>
<br>
<font color="#0000ff" size="2"><strong>格式:</strong></font> <br>
&nbsp; <font size="2">CHECKITEMW&nbsp; 物品名 数量 </font>&nbsp;<br>
<br>
<font size="2"><strong>============================</strong></font></p>
<p><font size="2">[@TEST] <br>
#IF <br>
CHECKITEMW&nbsp; 力量戒指 1 <br>
#elsesay</font> <br>
<font size="2">你身上没有力量戒指\ \</font> <br>
<font size="2">#elseact <br>
break</font></p>
<p><font size="2"><strong>============================</strong></font></p>
<p>[@TEST1]<br>
  #IF<br>
  COMPARETEXT &lt;$DRESS&gt; 布衣(男)<br>
  #elsesay <br>
  你身上没有布衣(男)\ \ <br>
  #elseact <br>
  break<br>
</p>
</body>
