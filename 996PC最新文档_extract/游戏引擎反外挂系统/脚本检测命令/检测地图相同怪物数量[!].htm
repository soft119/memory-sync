<HTML>
<HEAD>
<meta http-equiv="Content-Language" content="zh-cn">

<title>检测地图相同怪物数量[!]</title>
</head>

<body>
<p>格式: CheckMapSameMonCount 地图名称 怪物名称 控制符(&lt;,&gt;,=) 数量 是否忽略怪物名称后面的数字(0=检测数字,1=不检测数字)</p>
<p> [@Main] <br />
  #IF<br />
  CheckMapSameMonCount 3 稻草人 &gt; 10 <br />
  #SAY<br />
  土城的稻草人大于10个</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
</body>
</html>
