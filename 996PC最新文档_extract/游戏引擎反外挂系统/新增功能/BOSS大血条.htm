<P><FONT color=#0000ff face=宋体>BOSS大血条<BR><BR><FONT color=#000000>1、BOSS大血条的素材读取的是必备补丁下的750-970.<BR>官方提供了3套素材底图，UI编辑器上也可以自由设置自己的血条UI。<BR><BR>2、M2-BOSS血条里面设置的怪物大血条都可以自由设置怪物头像，血条样式ID指的是UI编辑器里面血条样式序号<BR><BR>3、血条层数指的是怪物血条显示的层数。比如怪物血量80万，设置为10层，那么会在血条上显示一个"X10"字样<BR>&nbsp;&nbsp; 
表示血条有10层，每一层8万血，每层血条会按照UI的顺序变换颜色及特效。<BR><BR><FONT color=#ff0000>4、修改完BOSS大血条的设置以后一定要加载一下怪物数据，否则修改不会立即生效。<BR></FONT><BR><BR><IMG alt="" src="dxt.png"><BR><BR></FONT></FONT><FONT color=#0000ff face=宋体><BR><IMG alt="" src="dxt1.png"><BR><BR><BR><!--StartFragment --></P>
