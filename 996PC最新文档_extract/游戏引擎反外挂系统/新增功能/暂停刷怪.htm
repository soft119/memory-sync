<P><FONT color=#0000ff face=宋体>暂停游戏刷怪<BR><BR></FONT><FONT color=#ff0000 face=宋体>注：暂停刷怪之后所有刷怪时间都会往后推迟，直到恢复刷怪继续计时。<BR>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 
刷新时间是往后推迟，恢复之后可能会有几十秒的偏差。</FONT></P>
<P><FONT face=宋体>检测是否暂停刷怪：<BR>CheckStopM2MakeMon</FONT></P>
<P><FONT face=宋体>暂停M2Server刷怪<BR>StopM2MakeMon 参数1(0:恢复刷怪；1:暂停)</FONT></P>
<P><FONT face=宋体>[@test]<BR>#if<BR>CheckStopM2MakeMon<BR>#act<BR>StopM2MakeMon 
0<BR>sendmsg 6 现在已经恢复M2刷怪<BR>#elseact<BR>StopM2MakeMon 1<BR>sendmsg 6 
现在已经暂停M2刷怪</FONT></P></body>
