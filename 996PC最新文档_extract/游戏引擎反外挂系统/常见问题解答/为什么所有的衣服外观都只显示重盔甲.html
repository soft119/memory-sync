</HEAD>
<BODY>
<P><STRONG><FONT 
size=2>为什么所有的衣服外观都只显示重盔甲？</FONT></STRONG></P>
<P><FONT size=2> </FONT>登录器配置器-内挂默认设置 衣服简装显示不要勾选 然后在配置登录器。或者在M2-选项客户端设置-内挂控制-玩家简装显示不要勾选，这样直接去掉这个功能</P>
<P>登录器呼出内挂-所有玩家简装显示 不要勾选</P>
