<P>&lt;$MACHINEID&gt;     机器码，和登录的角色无关，只要是该机器登录的角色，这个机器码就一样。<br>
&lt;$USERMACHINEID&gt; 该机器当前登录的角色的机器码。不同的角色名称或不同的机器登录生成的机器码不一样。</P>
<p>配合以下命令可以限制角色登录游戏</p>
<p>CheckTextList 文件位置 字符串<br>
  AddTextList 文件位置 字符串<br>
  DelTextList 文件位置 字符串</p>
