<p><span style="color: rgb(0, 0, 255); font-family: &quot;Microsoft YaHei&quot;; font-size: medium; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; text-decoration-style: initial; text-decoration-color: initial; display: inline !important; float: none;">M2-选项-</span><span class="style1">客户端设置-内挂控制-攻击速度的动作时间 越小速度越快。这里的数值表示，数值越小，每秒砍的刀数越多</span></p>
