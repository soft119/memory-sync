<P><FONT color=#0000ff>  <FONT face=宋体><STRONG>取数值的百分比方式<BR></STRONG><BR></FONT><FONT color=#000000 face="宋体" >格式:CalcPer&nbsp;&nbsp;&nbsp; 当前数值&nbsp;&nbsp;&nbsp;&nbsp; 
百分比&nbsp;&nbsp;&nbsp; 保存变量<BR><BR>例子:</FONT></FONT><FONT color=#000000 face="宋体" >取300的15%<BR></FONT></P>
<P><FONT color=#000000 face="宋体" >[@百分比]<BR>#IF<BR>#ACT<BR></FONT><FONT color=#000000 face="宋体" >CalcPer 300 15 N0<BR>SENDMSG 6
