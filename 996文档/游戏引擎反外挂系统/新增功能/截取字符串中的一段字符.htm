<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>截取字符串中的一段字符</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">
<style>
html,body { 
	/* Default Font */
	font-family: Arial, Helvetica, sans-serif;
	font-size: 11pt;
}
</style>

</head>

<body>
<H2>截取字符串中的一段字符<BR><BR></H2>
<P><SPAN style="FONT-SIZE: 12pt; FONT-WEIGHT: bold"><FONT size=3><FONT color=#ff0000>CopyText </FONT> </FONT></SPAN></P>
<P><STRONG><FONT size=3 color=#000000>参数1=待处理字符串 </FONT></STRONG></P>
<P><STRONG><FONT size=3 color=#000000>参数2=待拷贝字符初始位置 </FONT></STRONG></P>
<P><STRONG><FONT size=3 color=#000000>参数3=拷贝字符数量 </FONT></STRONG></P>
<P><STRONG><FONT size=3 color=#000000>参数4=保存的变量 </FONT></STRONG></P>
<P><STRONG><FONT size=3 color=#000000>NPC排版用起来很方便 注意：中文、英文、数字通用</FONT></STRONG></P>
<P><FONT size=3 color=#000000>例子：<BR></FONT><FONT size=3 color=#000000>#ACT<BR></FONT><FONT size=3 color=#000000>;S0=木土<BR></FONT><FONT size=3><FONT color=#000000>CopyText 金木土水火 2 2 S0 </FONT>     
</FONT></P>
<P><FONT size=3 color=#000000></FONT>&nbsp;</P>
<P><FONT size=3 color=#000000>#ACT<BR></FONT><FONT size=3 color=#000000>;S0=BC<BR></FONT><FONT size=3><FONT color=#000000>CopyText ABCDE 2 2 S0 </FONT>     
</FONT></P>
<P><FONT size=3 color=#000000></FONT>&nbsp;</P>
<P><FONT size=3 color=#000000>#ACT<BR></FONT><FONT size=3 color=#000000>;S0=23<BR></FONT><FONT size=3><FONT color=#000000>CopyText 12345 2 2 
S0</FONT>    
</FONT></P></body>
</html>
