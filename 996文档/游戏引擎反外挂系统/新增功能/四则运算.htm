<P><FONT color=#0000ff face=宋体>四则运算计算命令</FONT></P>
<P><FONT face=宋体>FORMULATION 参数1 参数2<BR>参数1：计算公式<BR>参数2：存入变量</FONT></P>
<P><FONT color=#808080><FONT color=#ff0000>注:/代表除&nbsp;&nbsp;&nbsp; *代表乘&nbsp;&nbsp;&nbsp; 
+代表加&nbsp;&nbsp;&nbsp; -代表减&nbsp; &nbsp; %为取余数&nbsp; 
()优先计算括号</FONT><BR></FONT><BR><FONT face=宋体>//例子：<BR>#if<BR>#act<BR>FORMULATION 2/(100+20)*100+100 
N$切割值<BR>sendmsg 6 
提示:您的切割值为&lt;$STR(N$切割值)&gt;<BR><BR><BR>[@main]<BR>#act<BR>FORMULATION 
(10+20%9)%5 N$测试<BR>sendmsg 6 &lt;$STR(N$测试)&gt;<BR><BR><BR></P>
<P><FONT face=宋体>;如果运算符号书写错误&nbsp;返回-1</FONT></P></FONT></body>
