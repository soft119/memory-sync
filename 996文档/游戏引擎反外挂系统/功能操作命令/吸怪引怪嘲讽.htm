<body>
<p><FONT face=宋体>吸怪引怪嘲讽</FONT></p>
<p><FONT face=宋体>DoTaunt 范围 怪物最低等级 
是否包含人物(0=不包含 1=  包含) 是否瞬移过来，对人物无效，只针对怪物(0= 走动

<p><FONT face=宋体>[@main]<br>
  #if<br>
  #act<br>
  DoTaunt 5 100<br>
SENDMSG 自身坐标范围5，等级大于等于100级的怪物会吸引过来</FONT>
 </p></FONT>
