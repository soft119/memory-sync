<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>自定义变量按变量值大小排序[!]</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">

</head>

<BODY>
<P><FONT face=宋体>SortVarToList<br>
功能：<br>
自定义变量按变量值大小排序，并把排序后变量值对应的人物名存放到指定列表文件中(制作排行榜用)</FONT>
</P>
<p><FONT face=宋体>格式：<br>
  SortVarToList 
自定义变量名 自定义变量文件路径 排序后列表的保存路径 降序还是升序(0-1) 保存格式(0-1)为0时只保存人物名,为1时:人物名 
变量值.</FONT>
        </p>
<p><FONT face=宋体>例子：</FONT></p>
<p><FONT face=宋体>[@test2]<br>
  #if<br>
  #act<br>
  SortVarToList LJSQZS ..\QuestDiary\数据文件\Test.txt ..\QuestDiary\数据文件\排序的文件.txt 0 1<br>
  break<br></FONT>
</p>
</BODY>
</html>
