<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0//EN">
<HTML>
<HEAD>
<meta http-equiv="Content-Language" content="zh-cn">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">
<title>自定义采集[!]</title>
</HEAD>
<BODY>
<P><FONT face=宋体>采集功能格式:<br>
SHOWPROGRESSBARDLG 时间(秒) 触发字段 提示信息 有动作是否中断(0不中断,1中断) 
中断触发字段</FONT>
     </P>
<p><FONT face=宋体>使用示例：<br>
  [@Main]<br>
  #ACT<br>
  SHOWPROGRESSBARDLG 5 @采集完成 正在采集,进度%d%...  1 @采集中断<br>
  Break</FONT>
  </p>
<p><FONT face=宋体>QF触发<br>
  [@采集完成]<br>
  #ACT<br>
  Give 回城卷 1<br>
  SendMsg 5 你采集一个回城卷<br>
  Break</FONT>
  </p>
<p><FONT face=宋体>[@采集中断]<br>
  #ACT<br>
  SendMsg 5 采集被中断<br>
  Break</FONT>
  </p>
</BODY>
</HTML>
