<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0//EN">
<HTML>
<HEAD>
<meta http-equiv="Content-Language" content="zh-cn">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">
<title>发送聊天框固顶信息</title>
<style type="text/css">
<!--
.STYLE1 {color: #0000FF}
-->
</style>
</HEAD>
<BODY>
<p><strong><FONT face=宋体>发送聊天框固顶信息</FONT></strong></p>
<p><FONT face=宋体>SENDTOPCHATBOARDMSG 
发送模式(0发送给所有人,1发送给自己,2跨服发送) 字体颜色 背景颜色 时间(秒) 信息 是否显示人物名称(0显示，1不显示)</FONT>      </p>
<p><FONT color=#ff0000 size=2 face=宋体>%ServerName 区名称</FONT></p>
<p><FONT face=宋体>[@Main]<br>
  SENDTOPCHATBOARDMSG 0 149 235 30 %s:聊天框固顶信息 </FONT>
       
</p>
<p><FONT face=宋体>[@跨服发送]<br>
SENDTOPCHATBOARDMSG 2 149 235 30 <FONT color=#ff0000 size=2>%ServerName</FONT>:%s:聊天框固顶信息 </FONT> </p>
</BODY>
</HTML>
