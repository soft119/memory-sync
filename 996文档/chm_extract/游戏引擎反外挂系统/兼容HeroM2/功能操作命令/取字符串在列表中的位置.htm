<title>取字符串在列表中的位置</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">

</head>

<BODY><FONT size=2><FONT face=Fixedsys>功能: 取字符串在列表中的下标.<BR></FONT><FONT face=Fixedsys size=2>格式:&nbsp;GetStringPos 路径 字符串<BR>说明: 
返回值放在人物的N0变量中,如果值=9999999说明没有找到.<BR>其他: 
返回值可以通过EQUAL做条件检测<BR>
<BR>
[@main]<BR>#IF<BR>#ACT<BR>GetStringPos 
..\QuestDiary\测试.txt 管理员<BR>
SendMsg 5 
字符串在列表中的位置:&lt;$STR(N0)&gt;</FONT></FONT> 
<BR><BR><BR>注：GetCacheStringPos写法一样，区别只是从缓存检测，速度更快，但是只读取一次，修改文本也不会再更新
</BODY>
</html>
