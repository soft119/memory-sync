<H2><FONT color=#0000ff>将变量插入字符串指定位置</FONT></H2>

      <P><FONT color=#ffffff ><FONT color=#000000><FONT color=#ff0000>INsert</FONT> 参数一(原字符串或变量) 参数二(插入的位置) 参数三(插入的内容)

      <P>例子：</P>
      <P>#ACT</P>
      <P>;在字符串 一二三 的第2个字符位置插入字符 四 S1=一二四三 </P>

      2 四 S1</P></body>
