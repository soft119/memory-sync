<P><FONT face=宋体><FONT color=#0000ff><STRONG>将自己宝宝移动至指定坐标<BR></STRONG></FONT><BR>MOVESLAVE 参数1 参数2 参数3<BR>参数1: 0全部BB 
大于0为第几只BB<BR>参数2: 新X坐标<BR>参数3: 新Y坐标</FONT></P>
<P><FONT face=宋体>;例子:<BR>[@main]<BR>#IF<BR>#ACT<BR>MOVESLAVE 0 333 
333<BR><BR><BR><BR></P>
<P><FONT face=宋体><FONT color=#0000ff><STRONG>获取宝宝坐标<BR></STRONG></FONT><BR>&lt;$SlaveX&gt; 
宝宝自身X坐标（当有多个宝宝时，随便选一个）<BR>&lt;$SlaveY&gt; 
宝宝自身Y坐标（当有多个宝宝时，随便选一个）<BR><BR>;例子:<BR>[@main]
<BR>
#IF
<BR>
#ACT
<BR>SENDMSG 7 
当前宝宝坐标&lt;$SlaveX&gt;,
<FONT face=宋体 >&lt;$SlaveY&gt;</FONT>
<BR >

<BR>
<BR><BR ><BR>   <BR></FONT></P></FONT></body>
