<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0//EN">

<HEAD>
<meta http-equiv="Content-Language" content="zh-cn">

<title>显示倒计时信息提示</title>
</head>

<body>
<p><font color="#0000ff" size="2" face=宋体><strong>功能:</strong></font><font color="#0000ff" size="2"><strong><br ><FONT face=宋体></p></FONT></STRONG></FONT><FONT face=宋体>显示倒计时信息提示<br >
<font color="#0000ff" size="2" ><strong>格式:</strong></font>
<br >SENDDELAYMSG 信息内容 时间(秒) 字体颜色 换地图是否删除 跳转字段     </FONT>
<p><font face="宋体">[@测试]<br >
#if<br >
#act<br >
SENDDELAYMSG 你的礼物在%s后到达 300 255 0 @给礼物</font></p>
<p><FONT face=宋体>[@给礼物]<br>
  #ACT<br>
GIVE 布衣(男)</FONT>
 </p>
<p><FONT face=宋体>------------------------------------------<br >
300秒倒计时结束后会执会当前脚本文件里的[@给礼物]段</FONT></p>
</body>
</html>
