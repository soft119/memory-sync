<p>功能： </p>
<p>  检测人物宝宝名字 <br >
  <br >
  格式： <br >
  <br >
  ;========================================== <br >
  [@main] <br >
  #IF <br >
CHECKSLAVENAME 996m2<br >
  #ACT <br >
  SENDMSG 5 提示:你的宝宝叫996m2<br >
  #ELSEACT<br >
  SENDMSG 5   提示:你的宝宝不叫996m2<br >
;==========================================
